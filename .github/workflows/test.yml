name: Cross-platform checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned runtime
        run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
        shell: bash
      - name: Python tests (includes native Windows shortcuts, locks and process lifecycle)
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Codex protocol tests
        run: node --test test-codex-client.mjs
      - name: Verify official npm Codex entry on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm install --global @openai/codex
          python -c "import codex_support, subprocess, shutil; cli = codex_support.find_cli(); subprocess.run(([shutil.which('node'), cli] if cli.endswith('.js') else [cli]) + ['--version'], check=True)"
      - name: Generate and check pinned desktop adapter
        shell: bash
        run: |
          python -c "from pathlib import Path; import codex_support; codex_support.prepare(Path('node_modules/dsh-pet'))"
          node --check node_modules/dsh-pet/lib/codex-standalone.js
          node --check node_modules/dsh-pet/runtime/codex-helper/sprite.js
